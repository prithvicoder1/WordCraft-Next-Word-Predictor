<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">WordCraft — Find your next word</title>
  <desc id="desc">Dark editorial banner with bold WordCraft lettering and a lime green signal waveform.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0a0d10"/>
      <stop offset="1" stop-color="#11171a"/>
    </linearGradient>
    <linearGradient id="line" x2="1">
      <stop stop-color="#c9fa61" stop-opacity="0"/>
      <stop offset=".48" stop-color="#c9fa61"/>
      <stop offset="1" stop-color="#c9fa61" stop-opacity=".18"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#899396" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
