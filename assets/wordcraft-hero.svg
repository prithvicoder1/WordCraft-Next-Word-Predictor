  <text x="88" y="277" fill="#f5f7f0" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="112" font-weight="900" letter-spacing="-7">FIND YOUR</text>
  <text x="88" y="390" fill="#f5f7f0" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="112" font-weight="900" letter-spacing="-7">NEXT WORD.</text>
